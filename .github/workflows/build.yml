name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - canary
      - xinplayer-streaming
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Remove obsolete Kotlin Android plugin from ffMetadataEx
        run: sed -i '/kotlin("android")/d' ffMetadataEx/build.gradle.kts

      - name: Remove obsolete Kotlin Android plugin from taglib
        run: sed -i '/kotlin("android")/d' taglib/build.gradle.kts

      - name: Align Media3 included-build AGP version
        run: |
          grep -RIl '9.0.0-rc03' media --include='*.toml' --include='*.gradle' --include='*.gradle.kts' | xargs -r sed -i 's/9.0.0-rc03/9.0.0/g'

      - name: Build debug APK
        run: ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/core/debug/*.apk

      - name: Run lint and unit tests
        run: ./gradlew lintCoreDebug testCoreDebugUnitTest --stacktrace -DskipFormatKtlint

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping notification."
            exit 0
          fi

          if [ "$BUILD_RESULT" = "success" ]; then
            MESSAGE="✅ XinPlayer build succeeded!%0ABranch: $BRANCH%0A$RUN_URL"
          else
            MESSAGE="❌ XinPlayer build $BUILD_RESULT.%0ABranch: $BRANCH%0ACheck logs: $RUN_URL"
          fi

          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
